name: Windows E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/pf-t704-windows-e2e, feature/pf-t706-accessibility, feature/pf-t707-security-audit, feature/pf-t708-cross-browser-qa, feature/pf-t709-axure-parity-tests, feature/pf-t710-device-responsive-tests, feature/pf-t711-multi-device-preview-export-tests, feature/pf-t713-onboarding-tutorial-docs-tests, feature/pf-t716-axure-workflow-regressions, feature/pf-t801-import-modal-sandbox, feature/pf-t802-smart-parser-icon-matcher]

permissions:
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-desktop:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:browser -- --workers=1
      - run: npm run build:e2e:desktop
      - name: Install Edge WebDriver matching the WebView2 runtime
        # Tauri renders with WebView2, which can lag far behind the runner's Edge browser
        # (WebView2 131 vs Edge 157 on windows-2022). The driver on PATH matches Edge, and
        # @wdio/tauri-service's own download fails on Windows PowerShell 5.1, so fetch the
        # matching driver here and put it first on PATH, where the service finds and reuses it.
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $version = $null
          foreach ($key in $keys) {
            if (Test-Path $key) {
              $version = (Get-ItemProperty -Path $key).pv
              if ($version) { break }
            }
          }
          if (-not $version) { throw 'Could not read the WebView2 runtime version from the registry.' }
          Write-Output "WebView2 runtime version: $version"
          $dir = Join-Path $env:RUNNER_TEMP "msedgedriver-$version"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver_win64.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          & (Join-Path $dir 'msedgedriver.exe') --version
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Run desktop E2E tests
        shell: pwsh
        run: |
          npm run test:e2e:desktop 2>&1 | Tee-Object -FilePath desktop-e2e.log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            Get-Content desktop-e2e.log |
              Select-String -Pattern 'FAILED|ERROR|Error:|TypeError|AssertionError|DevToolsActivePort|session not created|timed out|Timeout|Process completed' |
              Where-Object { $_.Line -notmatch '\bWARN\b' } |
              Select-Object -Last 8 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            Write-Output "::error::Desktop E2E exited with code $testExitCode; inspect the desktop-e2e.log artifact."
            exit $testExitCode
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-results
          path: |
            playwright-report/
            test-results/
            desktop-e2e.log
          if-no-files-found: warn
          retention-days: 14
