name: Windows E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/pf-t704-windows-e2e, feature/pf-t706-accessibility, feature/pf-t708-cross-browser-qa]

permissions:
  contents: read

concurrency:
  group: windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:browser
      - run: npm run build:e2e:desktop
      - name: Run desktop E2E tests
        shell: pwsh
        run: |
          npm run test:e2e:desktop 2>&1 | Tee-Object -FilePath desktop-e2e.log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            Get-Content desktop-e2e.log |
              Select-String -Pattern 'FAILED|ERROR|Error:|timed out|Timeout|not found|failed' |
              Select-Object -Last 20 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit $testExitCode
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-results
          path: |
            playwright-report/
            test-results/
            desktop-e2e.log
          if-no-files-found: warn
          retention-days: 14
