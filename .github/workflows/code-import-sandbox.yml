name: Code import parser and sandbox

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/pf-t801-import-modal-sandbox, feature/pf-t802-smart-parser-icon-matcher]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-code-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run parser, icon matcher, and sandbox unit tests
        run: npx vitest run src/project/htmlImport.test.ts src/layout/ImportCodeDialog.component.test.tsx
      - name: Run PF-T801 browser workflow
        run: npx playwright test e2e/browser/import-code.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-t801-browser-evidence
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: warn
          retention-days: 14
