name: Windows desktop packages

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-packages.yml"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - feature/cross-platform-desktop-releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installers (x64)
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Run frontend production build
        run: npm run build
      - name: Run unit tests
        run: npm test -- --run --testTimeout 20000
      - name: Build unsigned MSI and NSIS installers
        run: >-
          npx tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Collect and verify installer outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle'
          $out = 'windows-packages'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $files = Get-ChildItem -Path $bundleRoot -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe') }
          if (-not ($files | Where-Object { $_.Extension -eq '.msi' })) { throw 'MSI installer was not produced.' }
          if (-not ($files | Where-Object { $_.Extension -eq '.exe' })) { throw 'NSIS installer was not produced.' }
          foreach ($file in $files) { Copy-Item $file.FullName $out }
          Get-ChildItem $out -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content (Join-Path $out 'SHA256SUMS-windows.txt')
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installers
          path: windows-packages/
          if-no-files-found: error
          retention-days: 14
