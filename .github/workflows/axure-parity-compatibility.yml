name: PF-T513 Axure-parity compatibility

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-browser-and-desktop:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PF_DEVICE_FULL: ${{ github.event_name == 'push' && '1' || '0' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - if: github.event_name == 'push'
        run: npx playwright install chromium firefox webkit
      - if: github.event_name != 'push'
        run: npx playwright install chromium
      - name: Run Axure-parity feature and workflow regressions
        run: npm run test:axure-parity
      - name: Build browser application
        run: npm run build
      - name: Verify browser preview and device behavior
        run: npm run verify:devices
      - name: Run native Rust/Tauri tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build Windows desktop application
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --no-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-t513-windows-browser-evidence-${{ github.run_id }}
          path: reports/device-verification/screenshots/
          if-no-files-found: ignore
